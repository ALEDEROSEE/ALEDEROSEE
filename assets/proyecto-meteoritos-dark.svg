  <clipPath id="c"><rect width="480" height="220" rx="18"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="480" height="220" fill="#0f1324"/>
  <g class="brillo" opacity="0.24" filter="url(#b)">
