<circle cx="89" cy="62" r="4.5" fill="#A97BFF"/>
<text class="mono" x="100" y="66.5" font-size="13" fill="#6f7790">Kotlin · animaciones en Compose</text>
<rect x="386.0" y="26" width="70.0" height="22" rx="11" fill="#0f1324" stroke="#8B5CF6" stroke-opacity="0.55"/>
<text class="sans" x="421.0" y="41" font-size="10.5" font-weight="700" letter-spacing="0.8" text-anchor="middle" fill="#eef1f8" fill-opacity="0.85">ANDROID</text>
