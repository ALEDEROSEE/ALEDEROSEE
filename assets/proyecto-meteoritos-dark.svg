<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img"
  aria-label="Lluvia de meteoritos: Juego de carriles para esquivar meteoritos y juntar estrellas, más cuatro ejercicios de animación. El motor tiene 8 pruebas JUnit.">
<title>Lluvia de meteoritos</title>
<style>
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.brillo{animation:respira 6s ease-in-out infinite}
