  <rect width="480" height="3" fill="url(#g)"/>
</g>
<rect x="0.75" y="0.75" width="478.5" height="218.5" rx="17.5" fill="none" stroke="#252a45" stroke-width="1.5"/>
<rect x="24" y="24" width="46" height="46" rx="13" fill="url(#g)"/>
