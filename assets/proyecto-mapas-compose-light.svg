  <rect width="480" height="3" fill="url(#g)"/>
</g>
<rect x="0.75" y="0.75" width="478.5" height="218.5" rx="17.5" fill="none" stroke="#e3e1ee" stroke-width="1.5"/>
<rect x="24" y="24" width="46" height="46" rx="13" fill="url(#g)"/>
<g transform="translate(32 32) scale(1.25)" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.5s-6.5-6-6.5-11.5a6.5 6.5 0 0 1 13 0c0 5.5-6.5 11.5-6.5 11.5z"/><circle cx="12" cy="10" r="2.4"/></g>
