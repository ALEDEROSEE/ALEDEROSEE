<circle cx="89" cy="62" r="4.5" fill="#A97BFF"/>
<text class="mono" x="100" y="66.5" font-size="13" fill="#8a929c">Kotlin · Maps Compose</text>
<rect x="386.0" y="26" width="70.0" height="22" rx="11" fill="#ffffff" stroke="#10B981" stroke-opacity="0.55"/>
